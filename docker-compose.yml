version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: procureai_postgres
    restart: always
    environment:
      POSTGRES_DB: procureai_db
      POSTGRES_USER: procureai_user
      POSTGRES_PASSWORD: procureai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: procureai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
