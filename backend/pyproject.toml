[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis<8",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
